name: ci
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: provision toolchain and targets
        run: |
          rustup show active-toolchain
          rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y musl-tools mold qemu-user
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          unshare -U -n -r true && echo "userns probe: ok" || echo "userns probe: BLOCKED"
          cargo fetch --locked --target x86_64-unknown-linux-musl --target aarch64-unknown-linux-musl
      - name: pins and deps
        run: |
          tools/check-pins.sh
          tools/check-deps.sh
      - name: test
        run: cargo test --locked -q
      - name: clippy
        run: cargo clippy --locked -q --all-targets
      - name: release x86_64 musl
        run: cargo build --locked --release --target x86_64-unknown-linux-musl
        env:
          RUSTFLAGS: -Clinker=mold -Clinker-flavor=ld
      - name: release aarch64 musl
        run: cargo build --locked --release --target aarch64-unknown-linux-musl
        env:
          RUSTFLAGS: -Clinker=mold -Clinker-flavor=ld
      - name: smoke aarch64 binary under user-mode emulation
        run: qemu-aarch64 target/aarch64-unknown-linux-musl/release/mdevd -N -f "$GITHUB_WORKSPACE/tests/fixtures/laputa-mdev.conf" -d /tmp -s /tmp
      - name: ci pins
        run: tools/check-ci-pins.sh
