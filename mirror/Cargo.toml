[workspace]
members = ["webauthn-minimal"]

[package]
name = "laputa-mirror"
version = "0.1.0"
edition = "2024"

[dependencies]
base64ct = { version = "1", features = ["alloc"] }
webauthn-minimal = { path = "webauthn-minimal" }
graviola = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
http = "1"
http-body = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
h12tiny-client-sync = { version = "=0.9.0", registry = "mycrates", features = ["tls"] }
h12tiny = { version = "0.9", default-features = false, features = ["server", "http1", "util", "web"] }
futures-lite = { package = "laputa-futures-lite", version = "0.3", default-features = false, features = ["std"] }
async-io = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
rustls-graviola = "0.4"

[patch.crates-io]
h12tiny-client-normalize = { version = "=0.9.0", registry = "mycrates" }
h12tiny-tls-system = { version = "=0.9.0", registry = "mycrates" }

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

