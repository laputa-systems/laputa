[workspace]
members = ["webauthn-minimal"]

[package]
name = "laputa-mirror"
version = "0.1.0"
edition = "2024"

[dependencies]
base64ct = { version = "1", features = ["alloc"] }
webauthn-minimal = { path = "webauthn-minimal" }
graviola = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
h12tiny-client-sync = { git = "https://github.com/laputa-systems/h12tiny", rev = "421940c7b96a97884a450a6f5050ad040d978889", features = ["tls"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
rustls-graviola = "0.4"

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

