name: Laputa Validate

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  XSH_RELEASE: release-d09c6c3305ab8c650043bd8d32e03f2db6509e97
  XSH_RELEASE_ARCH: x86_64
  XSH_RELEASE_XSH_SHA256: 03e190c8ee15020b04b27e2066a7e53665452c9dce821bd0af80378ef664c746
  XSH_RELEASE_XSHI_SHA256: 897b22cae065625179f8b2cb18c48828464eb1cd135f32da0e9358b237f3e195
  XSH_RELEASE_XSHT_SHA256: 83ea617d6fc1a9f9e7908b292d51d8b263df15904d67d17b7c7f04d825a98a20

jobs:
  scripts:
    name: Released XSH script checks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Checkout packages
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          repository: laputa-systems/packages
          path: packages

      - name: Install XSH release
        run: |
          set -euo pipefail
          mkdir -p /tmp/xsh-release/bin
          for command_name in xsh xshi xsht; do
            case "$command_name" in
              xsh) sha="$XSH_RELEASE_XSH_SHA256" ;;
              xshi) sha="$XSH_RELEASE_XSHI_SHA256" ;;
              xsht) sha="$XSH_RELEASE_XSHT_SHA256" ;;
            esac
            path="/tmp/xsh-release/bin/$command_name"
            curl --proto '=https' --tlsv1.2 -fsSL "https://github.com/laputa-systems/xsh/releases/download/$XSH_RELEASE/$command_name-$XSH_RELEASE-$XSH_RELEASE_ARCH-linux-musl" -o "$path"
            echo "$sha  $path" | sha256sum -c -
            chmod 0755 "$path"
          done
          echo "/tmp/xsh-release/bin" >> "$GITHUB_PATH"

      - name: Check PM entrypoint
        run: |
          XSH_MODULE_PATH="$PWD/packages" \
            xsh packages/pm.xsh -- list /tmp/laputa-pm-root /tmp/laputa-pm-work /tmp/laputa-pm-out

      - name: Check boot entrypoint
        run: |
          set -euo pipefail
          if xsh boot.xsh -- --bad > /tmp/boot.out 2> /tmp/boot.err; then
            cat /tmp/boot.out
            cat /tmp/boot.err >&2
            exit 1
          fi
          grep -q "boot-usage" /tmp/boot.err

      - name: Check proof stage entrypoint
        run: |
          xsh proof-stage.xsh -- /tmp/laputa-proof-stage-root
