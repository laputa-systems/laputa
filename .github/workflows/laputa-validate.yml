name: Laputa Validate

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  XSH_RELEASE: release-d09c6c3305ab8c650043bd8d32e03f2db6509e97
  XSH_RELEASE_ARCH: aarch64
  XSH_RELEASE_XSH_SHA256: bc9117b8ac70c726002835e7ab1eaff0d45ede7b067bc85ddba7971eb8b8ffbb
  XSH_RELEASE_XSHI_SHA256: 5cf2f028fd0f0e6cbae213d7037e28e1aa92ca74768c5fce5e300d9725014bb6
  XSH_RELEASE_XSHT_SHA256: 86c2d1ac329702c0def779adb47640f84cdda9466630e2c98681750fc037a2e2

jobs:
  scripts:
    name: Released XSH script checks
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Checkout packages
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          repository: laputa-systems/packages
          path: packages

      - name: Install XSH release
        run: |
          set -euo pipefail
          mkdir -p /tmp/xsh-release/bin
          for command_name in xsh xshi xsht; do
            case "$command_name" in
              xsh) sha="$XSH_RELEASE_XSH_SHA256" ;;
              xshi) sha="$XSH_RELEASE_XSHI_SHA256" ;;
              xsht) sha="$XSH_RELEASE_XSHT_SHA256" ;;
            esac
            path="/tmp/xsh-release/bin/$command_name"
            curl --proto '=https' --tlsv1.2 -fsSL "https://github.com/laputa-systems/xsh/releases/download/$XSH_RELEASE/$command_name-$XSH_RELEASE-$XSH_RELEASE_ARCH-linux-musl" -o "$path"
            echo "$sha  $path" | sha256sum -c -
            chmod 0755 "$path"
          done
          echo "/tmp/xsh-release/bin" >> "$GITHUB_PATH"

      - name: Strict-check PM and Laputa modules
        run: |
          XSH_MODULE_PATH="$PWD/packages" xsht check --strict \
            packages/pm.xsh packages/pm/*.xsh packages/tests/xsh/*.xsh
          XSH_MODULE_PATH="$PWD:$PWD/packages" xsht check --strict \
            laputa.xsh laputa/*.xsh profiles/*.xsh guest/*.xsh tests/xsh/*.xsh

      - name: Run focused Laputa tests
        run: |
          XSH_MODULE_PATH="$PWD:$PWD/packages" xsht test \
            tests/xsh/cli.xsh tests/xsh/build.xsh tests/xsh/container_output.xsh \
            tests/xsh/docker.xsh tests/xsh/profile.xsh tests/xsh/qemu.xsh
