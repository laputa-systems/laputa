name: verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUSTC_WRAPPER: kache
      RUSTFLAGS: -Clinker=mold -Clinker-flavor=ld
      CARGO_BUILD_TARGET: x86_64-unknown-linux-musl
      UV_CACHE_DIR: ${{ github.workspace }}/.work/cache/uv
      UV_TOOL_DIR: ${{ github.workspace }}/.work/uv-tools
      UV_TOOL_BIN_DIR: ${{ github.workspace }}/.work/bin
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: prepare tools and locked dependencies
        run: |
          printf '\n.work/\n' >> .git/info/exclude
          mkdir -p .work/tmp .work/bin
          export TMPDIR="$PWD/.work/tmp"
          echo "TMPDIR=$TMPDIR" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y mold ninja-build python3-venv qemu-user
          curl -fsSL -o .work/tmp/kache.tar.gz https://github.com/kunobi-ninja/kache/releases/download/v1.0.0/kache-x86_64-unknown-linux-musl.tar.gz
          printf '%s  %s\n' 756e9701a6afb8354fd8b1d76164e13272d320354d84f01197e57d8a3b4be397 .work/tmp/kache.tar.gz | sha256sum -c -
          tar -xzf .work/tmp/kache.tar.gz -C .work/bin kache
          echo "$PWD/.work/bin" >> "$GITHUB_PATH"
          python3 -m venv .work/tools
          .work/tools/bin/pip install uv==0.12.23
          .work/tools/bin/uv tool install meson==1.12.1
          echo "$PWD/.work/tools/bin" >> "$GITHUB_PATH"
          export PATH="$PWD/.work/bin:$PWD/.work/tools/bin:$PATH"
          rustup show active-toolchain
          rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl
          cargo fetch --locked --target x86_64-unknown-linux-musl --target aarch64-unknown-linux-musl
      - name: rebuild the reference daemon and client
        run: sh harness/build_oracle.sh
      - name: check protocol and lifecycle behavior
        run: |
          cargo test --offline --locked
          cargo clippy --offline --locked --all-targets -- -D warnings
      - name: verify both release targets
        run: |
          cargo build --offline --locked --release --target x86_64-unknown-linux-musl
          cargo build --offline --locked --release --target aarch64-unknown-linux-musl
          ./target/x86_64-unknown-linux-musl/release/seatd -v
          qemu-aarch64 ./target/aarch64-unknown-linux-musl/release/seatd -v
          sh harness/libseat_diff.sh ./target/x86_64-unknown-linux-musl/release/seatd
          printf '%s\n' '#!/bin/sh' 'exec qemu-aarch64 ./target/aarch64-unknown-linux-musl/release/seatd "$@"' > .work/tmp/seatd-aarch64
          chmod +x .work/tmp/seatd-aarch64
          sh harness/libseat_diff.sh ./.work/tmp/seatd-aarch64
