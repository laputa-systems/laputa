name: prerelease
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: provision toolchain, linker, and libseat
        run: |
          rustup show active-toolchain
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y mold gcc libseat-dev libxkbcommon-dev
          cargo fetch --locked
      - name: test and lint
        run: |
          cargo test --locked
          cargo clippy --locked --all-targets
      - name: release musl build
        run: cargo build --locked --release --target x86_64-unknown-linux-musl
      - name: record source provenance
        run: |
          SHA="$(git rev-parse HEAD)"
          curl --fail --location "https://github.com/laputa-systems/tinyland/archive/${SHA}.tar.gz" --output source.tar.gz
          sha256sum source.tar.gz | tee provenance.txt
          echo "sha=$SHA" >> provenance.txt
          sha256sum target/x86_64-unknown-linux-musl/release/tinyland | tee -a provenance.txt
          cat provenance.txt >> "$GITHUB_STEP_SUMMARY"
      - name: upload prerelease artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tinyland-prerelease
          path: |
            provenance.txt
            target/x86_64-unknown-linux-musl/release/tinyland
