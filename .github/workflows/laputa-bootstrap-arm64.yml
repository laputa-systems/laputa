name: Laputa Bootstrap ARM64

on:
  workflow_dispatch:
    inputs:
      base_artifact_run_id:
        description: Workflow run ID that already produced samurai and pkgconf package artifacts
        required: true
        default: "26584102691"
      seed_artifact_run_id:
        description: Workflow run ID that already produced cmake through bison package artifacts
        required: true
        default: "26597763671"
      linux_artifact_run_id:
        description: Workflow run ID that already produced linux package artifacts
        required: true
        default: "26606282753"
      source_artifact_run_id:
        description: Workflow run ID that already produced musl and source mirror artifacts
        required: true
        default: "26551939333"

permissions:
  actions: read
  contents: read

jobs:
  bootstrap-muon:
    name: Bootstrap muon
    runs-on: ubuntu-24.04-arm
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Checkout packages
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          repository: laputa-systems/packages
          path: packages

      - name: Download seed musl package delta
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: laputa-bootstrap-musl-repo-delta-arm64
          path: .out/laputa-bootstrap-linux-repo
          run-id: ${{ inputs.source_artifact_run_id }}
          github-token: ${{ github.token }}

      - name: Download base package deltas
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: laputa-bootstrap-*-repo-delta-arm64
          path: .out/laputa-bootstrap-linux-repo
          merge-multiple: true
          run-id: ${{ inputs.base_artifact_run_id }}
          github-token: ${{ github.token }}

      - name: Download seed package deltas
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: laputa-bootstrap-*-repo-delta-arm64
          path: .out/laputa-bootstrap-linux-repo
          merge-multiple: true
          run-id: ${{ inputs.seed_artifact_run_id }}
          github-token: ${{ github.token }}

      - name: Download linux package delta
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: laputa-bootstrap-linux-repo-delta-arm64
          path: .out/laputa-bootstrap-linux-repo
          run-id: ${{ inputs.linux_artifact_run_id }}
          github-token: ${{ github.token }}

      - name: Download linux package index
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: laputa-bootstrap-linux-repo-index-arm64
          path: .out/laputa-bootstrap-linux-repo
          run-id: ${{ inputs.linux_artifact_run_id }}
          github-token: ${{ github.token }}

      - name: Download muon source mirror
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: laputa-muon-source-mirror-arm64
          path: .out/source-mirrors
          run-id: ${{ inputs.source_artifact_run_id }}
          github-token: ${{ github.token }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Image tags
        id: image
        shell: bash
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}/laputa-bootstrap-muon"
          ref="${GITHUB_REF_NAME//\//-}"
          echo "sha_tag=$repo:arm64-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "ref_tag=$repo:arm64-$ref" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push muon proof image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: Dockerfile.bootstrap-build-essential-native
          build-contexts: packages=packages
          platforms: linux/arm64
          target: bootstrap-muon-proof
          cache-from: |
            type=gha,scope=laputa-bootstrap-linux-arm64
            type=gha,scope=laputa-bootstrap-muon-source-mirror-arm64
            type=gha,scope=laputa-bootstrap-muon-arm64
          cache-to: type=gha,scope=laputa-bootstrap-muon-arm64,mode=max
          push: true
          tags: |
            ${{ steps.image.outputs.sha_tag }}
            ${{ steps.image.outputs.ref_tag }}

      - name: Export muon package repo
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: Dockerfile.bootstrap-build-essential-native
          build-contexts: packages=packages
          platforms: linux/arm64
          target: bootstrap-muon-repo-export
          cache-from: |
            type=gha,scope=laputa-bootstrap-muon-arm64
            type=gha,scope=laputa-bootstrap-muon-export-arm64
          cache-to: type=gha,scope=laputa-bootstrap-muon-export-arm64,mode=max
          outputs: type=local,dest=.out/laputa-bootstrap-muon-repo

      - name: Check muon package repo
        run: |
          test -f .out/laputa-bootstrap-muon-repo/index.json
          test -f .out/laputa-bootstrap-muon-repo/packages/aarch64/muon/muon-0.5.0-1.tar.gz
          test -f .out/laputa-bootstrap-muon-repo/packages/aarch64/linux/linux-7.0.5-6.tar.gz

      - name: Prepare muon package delta
        run: |
          rm -rf .out/laputa-bootstrap-muon-delta
          mkdir -p .out/laputa-bootstrap-muon-delta/packages/aarch64
          cp -R .out/laputa-bootstrap-muon-repo/packages/aarch64/muon .out/laputa-bootstrap-muon-delta/packages/aarch64/

      - name: Upload muon package index
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: laputa-bootstrap-muon-repo-index-arm64
          path: .out/laputa-bootstrap-muon-repo/index.json
          if-no-files-found: error

      - name: Upload muon package delta
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: laputa-bootstrap-muon-repo-delta-arm64
          path: .out/laputa-bootstrap-muon-delta
          if-no-files-found: error

  bootstrap-build-essential-native:
    name: Bootstrap build-essential-native
    runs-on: ubuntu-24.04-arm
    needs: bootstrap-muon
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Checkout packages
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          repository: laputa-systems/packages
          path: packages

      - name: Download seed musl package delta
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: laputa-bootstrap-musl-repo-delta-arm64
          path: .out/laputa-bootstrap-muon-repo
          run-id: ${{ inputs.source_artifact_run_id }}
          github-token: ${{ github.token }}

      - name: Download base package deltas
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: laputa-bootstrap-*-repo-delta-arm64
          path: .out/laputa-bootstrap-muon-repo
          merge-multiple: true
          run-id: ${{ inputs.base_artifact_run_id }}
          github-token: ${{ github.token }}

      - name: Download seed package deltas
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: laputa-bootstrap-*-repo-delta-arm64
          path: .out/laputa-bootstrap-muon-repo
          merge-multiple: true
          run-id: ${{ inputs.seed_artifact_run_id }}
          github-token: ${{ github.token }}

      - name: Download linux package delta
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: laputa-bootstrap-linux-repo-delta-arm64
          path: .out/laputa-bootstrap-muon-repo
          run-id: ${{ inputs.linux_artifact_run_id }}
          github-token: ${{ github.token }}

      - name: Download previous package deltas
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: laputa-bootstrap-*-repo-delta-arm64
          path: .out/laputa-bootstrap-muon-repo
          merge-multiple: true

      - name: Download muon package index
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: laputa-bootstrap-muon-repo-index-arm64
          path: .out/laputa-bootstrap-muon-repo

      - name: Download source mirrors
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: laputa-*-source-mirror-arm64
          path: .out/laputa-bootstrap-muon-repo/.out/source-mirrors
          merge-multiple: true
          run-id: ${{ inputs.source_artifact_run_id }}
          github-token: ${{ github.token }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Image tags
        id: image
        shell: bash
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}/laputa-bootstrap-build-essential-native"
          ref="${GITHUB_REF_NAME//\//-}"
          echo "sha_tag=$repo:arm64-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "ref_tag=$repo:arm64-$ref" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push build-essential-native proof image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: Dockerfile.bootstrap-build-essential-native
          build-contexts: packages=packages
          platforms: linux/arm64
          target: bootstrap-build-essential-native-proof
          cache-from: |
            type=gha,scope=laputa-bootstrap-muon-arm64
            type=gha,scope=laputa-bootstrap-build-essential-native-arm64
          cache-to: type=gha,scope=laputa-bootstrap-build-essential-native-arm64,mode=max
          push: true
          tags: |
            ${{ steps.image.outputs.sha_tag }}
            ${{ steps.image.outputs.ref_tag }}

      - name: Export build-essential-native package repo
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: Dockerfile.bootstrap-build-essential-native
          build-contexts: packages=packages
          platforms: linux/arm64
          target: bootstrap-build-essential-native-repo-export
          cache-from: |
            type=gha,scope=laputa-bootstrap-build-essential-native-arm64
            type=gha,scope=laputa-bootstrap-build-essential-native-export-arm64
          cache-to: type=gha,scope=laputa-bootstrap-build-essential-native-export-arm64,mode=max
          outputs: type=local,dest=.out/laputa-bootstrap-build-essential-native-repo

      - name: Check build-essential-native package repo
        run: |
          test -f .out/laputa-bootstrap-build-essential-native-repo/index.json
          test -f .out/laputa-bootstrap-build-essential-native-repo/packages/aarch64/baselayout/baselayout-1-10.tar.gz
          test -f .out/laputa-bootstrap-build-essential-native-repo/packages/aarch64/build-essential-native/build-essential-native-1-2.tar.gz
          test -f .out/laputa-bootstrap-build-essential-native-repo/packages/aarch64/muon/muon-0.5.0-1.tar.gz
          test -f .out/laputa-bootstrap-build-essential-native-repo/packages/aarch64/linux/linux-7.0.5-6.tar.gz
          test -f .out/laputa-bootstrap-build-essential-native-repo/.out/source-mirrors/linux-7.0.5-6-aarch64.tar.gz

      - name: Upload build-essential-native package repo
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: laputa-bootstrap-build-essential-native-repo-arm64
          path: .out/laputa-bootstrap-build-essential-native-repo
          if-no-files-found: error
          include-hidden-files: true
