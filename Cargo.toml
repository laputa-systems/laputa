[package]
name = "tinyland"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[[bin]]
name = "tinyland"
path = "src/main.rs"

[dependencies]
wayland-server = "0.31"
wayland-protocols = { version = "0.32", features = ["server"] }
drm = "0.15"
rustix = { version = "1.1", features = ["fs", "mm", "event", "process", "time"] }
evdev = "0.13"
xkbcommon = "0.9"
log = "0.4"
env_logger = "0.11"
bitflags = "2"
libc = "0.2"
memmap2 = "0.9"

[dev-dependencies]
tempfile = "3"
