module_path = lib
test_roots = tests

# Dropping `|error|` there makes the checker read the inferred variants as
# members of the item (check.unknown-field); XSH-176.
[lint.prefer-item-shorthand]
exclude = lib/infra/mutate.xsh
  lib/infra/transport.xsh

# `"{host}"` is a lock-path placeholder replaced with the host name, not an
# interpolation.
[lint.missing-f-prefix]
exclude = lib/infra/doctor.xsh
