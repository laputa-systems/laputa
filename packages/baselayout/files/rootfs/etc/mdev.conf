# Default Laputa device policy for mdev-compatible managers. devtmpfs owns
# baseline node creation; these rules set proof-oriented permissions and a
# small alias set for storage, input, DRM, ALSA, and serial devices.
SUBSYSTEM=block;(sd[a-z]) root:disk 660 >disk/%1
SUBSYSTEM=block;(sd[a-z][0-9]+) root:disk 660 >disk/%1
SUBSYSTEM=block;(nvme[0-9]+n[0-9]+) root:disk 660 >disk/%1
SUBSYSTEM=block;(nvme[0-9]+n[0-9]+p[0-9]+) root:disk 660 >disk/%1
SUBSYSTEM=block;(mmcblk[0-9]+) root:disk 660 >disk/%1
SUBSYSTEM=block;(mmcblk[0-9]+p[0-9]+) root:disk 660 >disk/%1
SUBSYSTEM=block;(loop[0-9]+) root:disk 660
SUBSYSTEM=block;.* root:disk 660

SUBSYSTEM=input;(event[0-9]+) root:input 660
SUBSYSTEM=input;(mouse[0-9]+) root:input 660
SUBSYSTEM=input;mice root:input 660

SUBSYSTEM=sound;.* root:audio 660
SUBSYSTEM=video4linux;.* root:video 660
dri/.* root:video 660
kvm root:kvm 660

tty[0-9]* root:tty 620
ttyS[0-9]* root:dialout 660
ttyUSB[0-9]* root:dialout 660
ttyACM[0-9]* root:dialout 660
