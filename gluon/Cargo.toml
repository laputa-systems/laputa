[workspace]
resolver = "2"
members = ["crates/graph", "crates/state", "crates/engine", "crates/meson", "crates/ninja", "bins/build", "bins/meson", "bins/ninja"]

[profile.release]
opt-level = 3
lto = "thin"
panic = "abort"
strip = false
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true

[workspace.lints.rust]
unsafe_code = "forbid"
