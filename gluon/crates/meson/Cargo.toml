[package]
name = "meson"
version = "0.1.0"
edition = "2024"
description = "A Meson build system compatible implementation in Rust"
license = "MIT OR Apache-2.0"

[dependencies]
glob = "0.3"
graph = { path = "../graph" }
regex-lite = "0.1"
deser-json = "0.10.2"
deser-value = "0.10.2"

[dev-dependencies]
rustybench = { version = "0.1" }

[[bench]]
name = "meson"
harness = false
