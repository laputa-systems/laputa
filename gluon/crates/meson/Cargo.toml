[package]
name = "meson"
version = "0.1.0"
edition = "2024"
description = "A Meson build system compatible implementation in Rust"
license = "MIT OR Apache-2.0"

[dependencies]
glob = "0.3"
regex-lite = "0.1"
deser-json = { version = "0.10.2", default-features = false }
deser-value = { version = "0.10.2", default-features = false }

[dev-dependencies]
rustybench = { version = "0.1" }

[[bench]]
name = "meson"
harness = false
