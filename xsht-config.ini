module_path = .
test_roots = tests
  xinit/tests
  packages/linux/tests
  packages/linux-headers/tests
exclude = target/**
  .claude/**
  .out/**
  .cache/**
  mirror/**
  # Fixture packages, proofs, and runner scripts are inputs that tests stage
  # and execute; they are not native test modules.
  tests/pm/fixtures/**/*.xsh
  tests/system/fixtures/**/*.xsh
  tests/integration/fixtures/**/*.xsh
  tests/integration/ntp-clock-boot.xsh
  xinit/tests/fixtures/**/*.xsh

[dead-code]
# Interfaces whose consumers the workspace scan cannot see: the remote admin
# procs drive tests/integration fixtures and Python lifecycle tests
# (docs/REMOTE-ADMIN.md), the generation adapter runs from a PM test fixture,
# and the make helpers are the recipe library documented in docs/MAKE.md.
public-api = system/remote.xsh
  pm/generation_adapter.xsh
  pm/make.xsh

# xinit tests run parse_control_verb from a script built by appending code to
# the xinit source, which a static scan cannot follow.
[lint.unused-callable]
exclude = xinit/xinit.xsh

# The fixed `activation.next` name is behaviour: the SSH activation fixture
# matches it in an fsync trace, and atomically replace would use a random name.
[lint.prefer-atomically-replace]
exclude = system/activation.xsh

# The helpers normalise a literal Map into JSON-decoded data on purpose.
[lint.json-roundtrip]
exclude = tests/system/backup.xsh
  tests/system/timers.xsh
