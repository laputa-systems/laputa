module_path = .
test_roots = tests
  xinit/tests
  packages/linux/tests
  packages/linux-headers/tests
  packages/mold/tests
exclude = target/**
  .claude/**
  .out/**
  .cache/**
  mirror/**
  # Fixture packages, proofs, and runner scripts are inputs that tests stage
  # and execute; they are not native test modules.
  tests/pm/fixtures/**/*.xsh
  tests/system/fixtures/**/*.xsh
  xinit/tests/fixtures/**/*.xsh
